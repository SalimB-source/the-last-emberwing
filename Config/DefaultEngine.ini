[/Script/Engine.RendererSettings]
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=True
r.DefaultFeature.Bloom=True
; Auto-exposition moteur desactivee par defaut : c'est AEmberwingLightingRig qui fige
; l'exposition dans son PostProcessVolume (min = max = ExposureBrightness). Une scene
; non buildee eclairlee a 1 lux et laissee a l'auto-exposition demarre noire pendant
; que le metaballer monte : c'est la cause classique du "j'ai un ecran noir".
; Si tu prefères l'auto-exposition : passe cette ligne a True et regle
; bForceReadableExposure = False sur l'acteur LightingRig.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=False
r.DefaultFeature.LocalExposure=False
; Lumen a condition de fonctionner sans "Build Lighting" : les meshes doivent etre traceables.
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.Reflections.Allow=1
r.Shadow.Virtual.Enable=1
r.SkyLight.RealTimeReflectionCapture=True
; IMPORTANT mobile : a 0, AUCUNE lumiere locale (braise du mante, lanternes, halo d'autel)
; n'est eclairee sur Android -> scene noire sur telephone meme si tout compile.
r.Mobile.EnableMovableSpotlights=1
r.Mobile.EnableMovableLightFX=1
r.Mobile.AmbientOcclusion=True

